<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JLA: Bairro em Jogo</title>
<meta name="description" content="O jogo da Associação de Moradores do Jardim Los Angeles, Ponta Grossa/PR.">
<meta property="og:title" content="JLA: Bairro em Jogo">
<meta property="og:description" content="Ande pelo bairro em 3D, faça missões e ajude os vizinhos. O jogo da Associação de Moradores do Jardim Los Angeles.">
<meta name="theme-color" content="#0A2240">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bairro em Jogo">
<style>
html,body{margin:0;height:100%;background:#0A2240;color:#fff;font:600 17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 16px}
.b{width:46px;height:46px;border:5px solid rgba(255,255,255,.2);border-top-color:#F57E20;border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
a{color:#ffd23f}
</style>
</head>
<body>
<div class="c"><div class="b"></div><div id="m">Carregando o bairro...</div></div>
<script>
/* Este endereço curto abre o jogo publicado no GitHub da Associação.
   Primeira vez: baixa o jogo e guarda no celular. Das próximas vezes abre na hora com o que está guardado,
   e o service worker baixa a versão nova em segundo plano (ela aparece na próxima vez que abrir). */
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__bip=e});
(function(){
  var SRC="https://associacaojardimlosangeles-create.github.io/jla-bairro-em-jogo/",KEY="/__jogo.html",CACHE="jogo-v1";
  function show(h){document.open();document.write(h);document.close()}
  function erro(){document.getElementById("m").innerHTML='Não deu para carregar agora. Confira a internet e <a href="">tente de novo</a>.'}
  function baixar(){return fetch(SRC+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.text()})}
  function avisarSW(){try{navigator.serviceWorker.ready.then(function(reg){if(reg.active)reg.active.postMessage({tipo:"atualizar",src:SRC,key:KEY,cache:CACHE})})}catch(e){}}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(function(){});
  if(!("caches" in window)){baixar().then(show).catch(erro);return}
  caches.open(CACHE).then(function(c){return c.match(KEY).then(function(m){
    if(m)return m.text().then(function(h){if(navigator.onLine!==false)avisarSW();setTimeout(function(){show(h)},30)});
    return baixar().then(function(h){return c.put(KEY,new Response(h,{headers:{"Content-Type":"text/html; charset=utf-8"}})).catch(function(){}).then(function(){show(h)})})})})
  .catch(function(){baixar().then(show).catch(erro)});
})();
</script>
</body>
</html>
